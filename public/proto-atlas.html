<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>אטלס הדורות — אב־טיפוס ב׳ | ציר הזמן של עם ישראל</title>
<style>
@font-face{font-family:'Frank Ruhl Libre';font-weight:500 900;font-display:swap;src:url('/fonts/frankruhllibre-hebrew.woff2') format('woff2');unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:'Heebo';font-weight:300 700;font-display:swap;src:url('/fonts/heebo-hebrew.woff2') format('woff2');unicode-range:U+0590-05FF,U+FB1D-FB4F}
:root{
  --bg:#efe4cb; --panel:#fbf5e7; --ink:#33281a; --muted:#6d5c42;
  --navy:#163a57; --navy2:#1d4b70; --gold:#b28a2b; --gold-ink:#7a5b16; --line:#dcc9a3;
  --wine:#9c2b50; --story-w:420px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo','Segoe UI',Arial,sans-serif}

/* ================= המפה — חלון קבוע בצד שמאל ================= */
#map-pane{position:fixed;top:0;bottom:0;left:0;width:calc(100% - var(--story-w));
  display:flex;flex-direction:column;background:linear-gradient(180deg,#f6edd8,var(--bg));
  border-inline-start:1px solid var(--line)}
#map-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;
  background:var(--panel);border-bottom:2px solid var(--gold)}
#map-title{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:18px;color:var(--navy);
  margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:16px;padding:6px 13px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--navy)}
.mbtn:hover{border-color:var(--gold)}
.mbtn:disabled{opacity:.4;cursor:default}
.mbtn.play{background:var(--navy);border-color:var(--navy);color:#fff}
#map-box{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
#map-fit{position:relative;transition:opacity .35s}
#map-fit.fade{opacity:0}
#map-fit img{position:absolute;inset:0;width:100%;height:100%}
#map-fit svg{position:absolute;inset:0;width:100%;height:100%}
.route{fill:none;stroke:var(--gold-ink);stroke-width:4;stroke-dasharray:9 9;stroke-linecap:round;opacity:.65}
.route-done{fill:none;stroke:var(--wine);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.pt circle{fill:var(--wine);stroke:#fbf5e7;stroke-width:3;r:15}
.pt text{fill:#fff;font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.pt{cursor:pointer}
.pt.done circle{fill:var(--gold)}
.pt.now circle{r:19;stroke-width:4}
/* חלונית תחנה */
#popup{position:absolute;z-index:6;width:230px;background:var(--panel);border:1.5px solid var(--gold);
  border-radius:12px;box-shadow:0 10px 28px rgb(60 40 0 / .3);padding:0;overflow:hidden;
  transition:opacity .3s;opacity:0;pointer-events:none}
#popup.show{opacity:1}
#popup .ph{background:var(--wine);color:#fff;font-size:13px;font-weight:800;padding:6px 11px;display:flex;gap:7px;align-items:center}
#popup .ph i{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;
  background:#fff;color:var(--wine);font-style:normal;font-size:11px;font-weight:800;flex:none}
#popup .pl{font-size:11.5px;font-weight:700;color:var(--gold-ink);padding:6px 11px 0}
#popup .pd{font-size:11.5px;line-height:1.65;padding:2px 11px 9px;margin:0;color:var(--ink)}
/* מקרא תחנות בתחתית המפה */
#legend{display:flex;gap:6px;overflow-x:auto;padding:9px 14px;background:var(--panel);
  border-top:1px solid var(--line);scrollbar-width:none}
#legend::-webkit-scrollbar{display:none}
.lg{flex:none;display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12px;font-weight:600;
  color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 11px;cursor:pointer}
.lg i{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;
  background:var(--wine);color:#fff;font-style:normal;font-size:10px;font-weight:800}
.lg.now{border-color:var(--gold);background:var(--panel)}
.lg.now i{background:var(--gold)}
#map-empty{position:absolute;inset:0;display:grid;place-items:center;z-index:4;
  background:rgb(239 228 203 / .55);backdrop-filter:blur(1px);opacity:0;pointer-events:none;transition:opacity .3s}
#map-empty.show{opacity:1}
#map-empty span{background:var(--panel);border:1px dashed var(--gold);border-radius:12px;
  padding:10px 18px;font-size:13.5px;color:var(--muted)}

/* ================= טור הסיפור — ימין ================= */
#story{position:relative;z-index:10;width:var(--story-w);margin-inline-end:auto;
  padding:18px 20px 40vh;min-height:100vh}
/* חוט הזהב */
#story::before{content:'';position:absolute;top:0;bottom:0;inset-inline-end:14px;width:2px;
  background:var(--gold);opacity:.45}
#p-head{margin:4px 0 18px}
#p-head h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:26px;color:var(--navy);margin:0}
#p-head p{font-size:12.5px;color:var(--muted);margin:2px 0 0}
#p-head a{color:var(--gold-ink)}
.era-head{position:sticky;top:10px;z-index:12;margin:26px 0 12px;width:fit-content;max-width:100%;
  background:var(--navy);color:#f4ecd8;font-size:14px;font-weight:800;border-radius:12px;padding:7px 15px;
  box-shadow:0 6px 18px rgb(10 20 40 / .3)}
.era-head b{color:#d9b755}
.card{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:13px;
  padding:13px 16px;margin:0 0 12px;cursor:pointer;
  opacity:.55;transition:opacity .3s,border-color .3s,box-shadow .3s}
.card::after{content:'';position:absolute;top:20px;inset-inline-end:-11.5px;width:9px;height:9px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);transition:transform .3s,background .3s}
.card h3{font-family:'Frank Ruhl Libre',serif;font-size:18px;font-weight:900;color:var(--navy);margin:0}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.card .nomap{display:inline-block;font-size:10.5px;color:var(--gold-ink);border:1px dashed var(--gold);
  border-radius:8px;padding:0 7px;margin-top:6px}
.card.on{opacity:1;border-color:var(--gold);box-shadow:0 8px 24px rgb(60 40 0 / .18)}
.card.on::after{background:var(--wine);transform:scale(1.5)}

/* ================= מובייל ================= */
@media (max-width:760px){
  :root{--story-w:100%}
  #map-pane{width:100%;height:46vh;bottom:auto;border-inline-start:none;border-bottom:2px solid var(--gold)}
  #map-head{padding:7px 10px}
  #map-title{font-size:15px}
  #legend{display:none}
  #story{padding-top:calc(46vh + 14px);padding-bottom:30vh}
  .era-head{top:calc(46vh + 8px)}
  #popup{width:190px}
}
</style>
</head>
<body>

<div id="map-pane">
  <div id="map-head">
    <h2 id="map-title">אטלס הדורות</h2>
    <button class="mbtn play" id="b-play">▶ הפעלת המסע</button>
    <button class="mbtn" id="b-prev">הקודם</button>
    <button class="mbtn" id="b-next">הבא</button>
    <button class="mbtn" id="b-all">סקירה</button>
  </div>
  <div id="map-box">
    <div id="map-fit">
      <img src="/israel-map.jpg" alt="מפת ארץ ישראל והמרחב"/>
      <svg id="ov" viewBox="0 0 820 1231" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="popup"></div>
    </div>
    <div id="map-empty"><span>לפריט זה אין מפת מסע — בחרו דמות אחרת מהציר</span></div>
  </div>
  <div id="legend"></div>
</div>

<main id="story">
  <header id="p-head">
    <h1>🗺️ אטלס הדורות</h1>
    <p>אב־טיפוס ב׳ · גללו בטור — המפה משמאל מתחלפת לדמות הפעילה · <a href="/">→ חזרה לציר</a></p>
  </header>
</main>

<script>
const $ = (s) => document.querySelector(s);
const IMG_W = 820, IMG_H = 1231;
let DATA = null, cards = [], active = -1, step = -1, playT = null;

// ---------- בניית טור הסיפור ----------
async function build() {
  DATA = await (await fetch('/proto-data.json')).json();
  const story = $('#story');
  const html = [];
  let idx = 0;
  DATA.eras.forEach((era) => {
    html.push(`<div class="era-head">✦ <b>${era.title}</b> · ${era.verse}</div>`);
    era.cards.forEach((c) => {
      html.push(`<article class="card" data-i="${idx}" id="card-${idx}">
        <h3>${c.name}</h3><div class="sub">${c.sub}</div>
        ${c.map ? '' : '<span class="nomap">ללא מפת מסע</span>'}
      </article>`);
      cards.push(c); idx++;
    });
  });
  story.insertAdjacentHTML('beforeend', html.join(''));
  document.querySelectorAll('.card').forEach((el) =>
    el.addEventListener('click', () => el.scrollIntoView({ block: 'center' })));
  fitMap(); pick(); addEventListener('scroll', pick, { passive: true });
  setInterval(pick, 300); // גיבוי לסביבות בלי אירועי scroll
  addEventListener('resize', () => { fitMap(); render(); });
}

// ---------- התאמת המפה לחלון ----------
function fitMap() {
  const box = $('#map-box').getBoundingClientRect();
  const s = Math.min(box.width / IMG_W, box.height / IMG_H) * .98;
  const fit = $('#map-fit');
  fit.style.width = IMG_W * s + 'px';
  fit.style.height = IMG_H * s + 'px';
  fit.dataset.s = s;
}

// ---------- ציור מסע הדמות הפעילה ----------
const smooth = (pts) => {
  if (pts.length < 2) return '';
  let d = `M ${pts[0].X} ${pts[0].Y}`;
  for (let i = 1; i < pts.length; i++) d += ` L ${pts[i].X} ${pts[i].Y}`;
  return d;
};
function render() {
  const c = cards[active];
  const ov = $('#ov'), lg = $('#legend');
  stopPlay();
  if (!c || !c.map) {
    ov.innerHTML = ''; lg.innerHTML = '';
    $('#map-title').textContent = c ? c.name : 'אטלס הדורות';
    $('#map-empty').classList.toggle('show', !!(c && !c.map));
    $('#popup').classList.remove('show');
    ['b-play','b-prev','b-next','b-all'].forEach(id => $('#'+id).disabled = true);
    return;
  }
  $('#map-empty').classList.remove('show');
  ['b-play','b-prev','b-next','b-all'].forEach(id => $('#'+id).disabled = false);
  $('#map-title').textContent = c.map.title;
  const pts = c.map.points;
  ov.innerHTML =
    `<path class="route" d="${smooth(pts)}"/><path class="route-done" d="${smooth(pts)}"/>` +
    pts.map((p, i) => `<g class="pt" data-p="${i}" transform="translate(${p.X} ${p.Y})">
       <circle/><text>${p.n}</text></g>`).join('');
  const done = ov.querySelector('.route-done');
  const len = done.getTotalLength();
  done.style.setProperty('--len', len); done.dataset.len = len;
  lg.innerHTML = pts.map((p, i) => `<button class="lg" data-p="${i}"><i>${p.n}</i>${p.name}</button>`).join('');
  ov.querySelectorAll('.pt').forEach(g => g.addEventListener('click', () => setStep(+g.dataset.p, true)));
  lg.querySelectorAll('.lg').forEach(b => b.addEventListener('click', () => setStep(+b.dataset.p, true)));
  step = -1; paint();
}

// ---------- צעדי המסע ----------
function paint() {
  const c = cards[active]; if (!c || !c.map) return;
  const pts = c.map.points, ov = $('#ov');
  ov.querySelectorAll('.pt').forEach(g => {
    const i = +g.dataset.p;
    g.classList.toggle('done', step >= 0 && i < step);
    g.classList.toggle('now', i === step);
  });
  $('#legend').querySelectorAll('.lg').forEach(b => b.classList.toggle('now', +b.dataset.p === step));
  const done = ov.querySelector('.route-done'), len = +done.dataset.len || 0;
  done.style.strokeDashoffset = step <= 0 ? len : len * (1 - step / (pts.length - 1));
  // חלונית
  const pop = $('#popup');
  if (step < 0) { pop.classList.remove('show'); return; }
  const p = pts[step], s = +$('#map-fit').dataset.s || 1;
  pop.innerHTML = `<div class="ph"><i>${p.n}</i>${p.name}</div>
    <div class="pl">${p.label || ''}</div><p class="pd">${(p.desc || '').slice(0, 150)}${(p.desc||'').length>150?'…':''}</p>`;
  const fx = p.X * s, fy = p.Y * s, fw = IMG_W * s, fh = IMG_H * s;
  pop.style.insetInlineStart = Math.max(6, Math.min(fw - 236, fx - 115)) + 'px';
  pop.style.top = (fy > fh * .55 ? fy * 1 - 150 : fy + 26) + 'px';
  pop.classList.add('show');
}
function setStep(i, manual) {
  if (manual) stopPlay();
  const c = cards[active]; if (!c || !c.map) return;
  step = Math.max(-1, Math.min(c.map.points.length - 1, i));
  paint();
}
function stopPlay() { if (playT) { clearInterval(playT); playT = null; $('#b-play').textContent = '▶ הפעלת המסע'; } }
$('#b-play').addEventListener('click', () => {
  if (playT) { stopPlay(); return; }
  const c = cards[active]; if (!c || !c.map) return;
  if (step >= c.map.points.length - 1) step = -1;
  setStep(step + 1);
  $('#b-play').textContent = '⏸ השהיה';
  playT = setInterval(() => {
    if (step >= c.map.points.length - 1) { stopPlay(); return; }
    setStep(step + 1);
  }, 2600);
});
$('#b-next').addEventListener('click', () => setStep(step + 1, true));
$('#b-prev').addEventListener('click', () => setStep(step - 1, true));
$('#b-all').addEventListener('click', () => setStep(-1, true));

// ---------- גלילה חד-ערכית: כרטיס אחד פעיל ----------
function pick() {
  const mid = innerHeight * (matchMedia('(max-width:760px)').matches ? .72 : .45);
  // הכרטיס שמרכזו הקרוב ביותר לקו המוקד — יציב גם עם כרטיסים קצרים
  let cur = 0, best = Infinity;
  document.querySelectorAll('.card').forEach((el) => {
    const b = el.getBoundingClientRect();
    const d = Math.abs((b.top + b.bottom) / 2 - mid);
    if (d < best) { best = d; cur = +el.dataset.i; }
  });
  // עיגון לקצוות: בראש הדף — הכרטיס הראשון; בתחתית — האחרון
  const se = document.scrollingElement;
  if (scrollY < 50) cur = 0;
  else if (scrollY + innerHeight > se.scrollHeight - 50) cur = cards.length - 1;
  if (cur !== active) {
    active = cur;
    document.querySelectorAll('.card').forEach(el => el.classList.toggle('on', +el.dataset.i === active));
    const fit = $('#map-fit');
    fit.classList.add('fade');
    setTimeout(() => { render(); fit.classList.remove('fade'); }, 180);
  }
}
build();
</script>
</body>
</html>

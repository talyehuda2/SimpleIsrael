<style>
@font-face{font-family:'Frank Ruhl Libre';font-weight:500 900;font-display:swap;src:url('/fonts/frankruhllibre-hebrew.woff2') format('woff2');unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:'Heebo';font-weight:300 700;font-display:swap;src:url('/fonts/heebo-hebrew.woff2') format('woff2');unicode-range:U+0590-05FF,U+FB1D-FB4F}
:root{
  --bg:#efe4cb; --panel:#fbf5e7; --ink:#33281a; --muted:#6d5c42;
  --navy:#163a57; --navy2:#1d4b70; --gold:#b28a2b; --gold-ink:#7a5b16; --line:#dcc9a3;
  --wine:#9c2b50;
  --leader:#9c2b50; --judge:#bd7038; --united:#6a3ca0; --judah:#245c93; --israel:#4f7a33;
  --prophet:#b3781a; --book:#157a70; --event:#b0392c; --world:#8a7250;
  --bar:56px; --detail-w:340px; --story-w:340px; --era-w:126px; --erabar:0px;
  --map-w:700px; --leg-w:150px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo','Segoe UI',Arial,sans-serif}
button{font-family:inherit}

/* ===================== סרגל עליון ===================== */
#bar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:40;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--panel);border-bottom:2px solid var(--gold);box-shadow:0 2px 10px rgb(60 40 0 / .12)}
#brand{display:flex;flex-direction:column;gap:1px;text-decoration:none;flex:none}
#bar h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:18px;color:var(--navy);margin:0;white-space:nowrap}
#brand span{font-size:10.5px;color:var(--gold-ink);font-weight:700;font-family:'Heebo',sans-serif;white-space:nowrap}
#brand:hover h1{color:var(--gold-ink)}
#bar .spacer{flex:1}
/* סרגל התקופות - טור אנכי בקצה ימין, צמוד לרשימת השמות */
#eras{position:fixed;top:var(--bar);bottom:0;inset-inline-start:0;width:var(--era-w);z-index:20;
  display:flex;flex-direction:column;gap:5px;padding:12px 9px;overflow-y:auto;scrollbar-width:none;
  background:var(--panel);border-inline-end:1px solid var(--line)}
#eras::-webkit-scrollbar{display:none}
.echip{flex:none;font-size:11.5px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:6px 8px;cursor:pointer;white-space:normal;text-align:center;line-height:1.35;
  transition:background .15s,color .15s,border-color .15s}
.echip:hover{border-color:var(--gold)}
.echip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tool{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
  border:1px solid var(--line);background:var(--bg);color:var(--navy);border-radius:14px;padding:6px 12px;cursor:pointer}
.tool:hover{border-color:var(--gold);background:var(--panel)}
.tool.primary{background:var(--navy);border-color:var(--navy);color:#fff}
#tools{display:flex;gap:6px;flex:none}

/* ===================== שלוש עמודות ===================== */
/* סדר מימין לשמאל: תקופות · שמות · פירוט · מפה */
#detail{position:fixed;top:var(--bar);bottom:0;left:var(--map-w);width:var(--detail-w);z-index:5;
  background:var(--panel);border-inline-start:1px solid var(--line);padding:16px 18px 30px;overflow-y:auto;overscroll-behavior:contain}
#detail .kind{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:14px;padding:2px 11px;margin-bottom:6px}
#detail h2{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:25px;color:var(--navy);margin:0}
#detail .yrs{font-size:12.5px;color:var(--muted);font-weight:600;margin:2px 0 4px}
#detail .approx{font-size:10.5px;color:var(--muted);font-style:italic}
#detail .jud{display:inline-block;font-size:10.5px;font-weight:700;border-radius:12px;padding:2px 9px;margin:4px 0}
#detail .jud.good{color:#2e6b33;background:rgb(79 122 51/.14)} #detail .jud.bad{color:#9c2f24;background:rgb(176 57 44/.12)}
#detail .jud.mixed{color:#7a5b16;background:rgb(178 138 43/.14)}
#detail .meta{font-size:12px;color:var(--muted);line-height:1.8;margin:6px 0 10px}
#detail .verse{background:var(--bg);border-inline-start:3px solid var(--gold);border-radius:10px;padding:9px 13px;margin:0 0 12px}
#detail .verse p{font-family:'Frank Ruhl Libre',serif;font-size:14px;line-height:1.7;margin:0;font-weight:600}
#detail .verse small{display:block;font-size:10.5px;color:var(--gold-ink);font-weight:700;margin-top:3px}
#detail .desc{font-size:13.5px;line-height:1.8;margin:0 0 12px}
#detail .src{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-bottom:12px}
#detail .src b{color:var(--navy)}
/* סיור קצר - זרקור על אזור אחד בכל פעם */
.tour-wrap{position:fixed;inset:0;z-index:80;background:rgb(30 20 5 / .55)}
.tour-ring{position:absolute;border:2.5px solid var(--gold);border-radius:12px;
  box-shadow:0 0 0 9999px rgb(30 20 5 / .55);background:transparent;pointer-events:none}
.tour-box{position:absolute;width:270px;max-width:calc(100vw - 24px);background:var(--panel);
  border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:13px 15px;
  box-shadow:0 12px 32px rgb(30 20 5 / .35)}
.tour-box b{display:block;font-size:15px;color:var(--navy);margin-bottom:4px}
.tour-box p{margin:0 0 10px;font-size:12.5px;line-height:1.65;color:var(--ink)}
.tour-nav{display:flex;align-items:center;gap:7px}
.tour-nav span{font-size:11px;color:var(--muted);margin-inline-end:auto;font-variant-numeric:tabular-nums}
.tour-nav button{font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  border-radius:16px;padding:6px 13px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tour-nav button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.tour-nav button:hover{border-color:var(--gold)}

/* גשר לציר הזמן ולדף המידע - שני המבטים על אותה דמות */
.bridge{border-top:1px solid var(--line);padding-top:10px;margin-bottom:12px}
.bridge h3{margin:0 0 7px;font-size:12px;color:var(--navy);font-weight:800}
.bridge h3 span{font-size:10.5px;color:var(--gold-ink);font-weight:700}
.bchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.bchip{display:inline-flex;align-items:center;gap:4px;font-family:inherit;font-size:11px;font-weight:600;
  color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px 7px;cursor:pointer}
.bchip:hover{border-color:var(--gold);color:var(--navy)}
.bchip i{font-style:normal;font-size:10px;line-height:1;flex:none;
  font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.blink{display:block;font-size:11.5px;font-weight:700;color:var(--navy);text-decoration:none;
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:5px}
.blink:hover{border-color:var(--gold);background:var(--panel)}
.blink.ghost{color:var(--muted);font-weight:600}
#detail .nav{display:flex;gap:6px}
#detail .nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--bg);
  color:var(--navy);border-radius:10px;padding:7px 6px;cursor:pointer;min-width:0}
#detail .nav button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail .nav button svg{flex:none;color:var(--gold-ink)}
/* פקדים שמופיעים רק במובייל */
#sheetClose,#mapClose,#sheetBack,#dMap{display:none}
#sheetClose{position:absolute;left:12px;top:10px;border:none;background:none;font-size:17px;color:var(--muted);cursor:pointer;z-index:2}
#mapClose{align-items:center;gap:5px}
#dMap{width:100%;margin:2px 0 10px;justify-content:center;gap:7px;font-size:13.5px;font-weight:800;
  background:var(--navy);border:1px solid var(--navy);color:#fff;border-radius:11px;padding:10px;cursor:pointer}
body.sheet-open #dMap{display:flex}
#detail .nav button:hover:not(:disabled){border-color:var(--gold)} #detail .nav button:disabled{opacity:.35;cursor:default}

#mapPane{position:fixed;top:var(--bar);bottom:0;left:0;width:var(--map-w);
  display:flex;flex-direction:column;background:linear-gradient(180deg,#f6edd8,var(--bg))}
/* גוף המפה: החלון מימין, ומקרא המקומות כטור אנכי משמאלו */
#mapBody{flex:1;min-height:0;display:flex}
/* כותרת ממורכזת ושורת כפתורים ממורכזת מתחתיה */
#mapHead{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 14px;
  background:var(--panel);border-bottom:2px solid var(--gold)}
#mapTitle{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:16px;color:var(--navy);margin:0;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#mapBtns{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.mbtn{font-size:12px;font-weight:700;border-radius:15px;padding:5px 12px;cursor:pointer;border:1px solid var(--line);
  background:var(--panel);color:var(--navy)}
.mbtn:hover:not(:disabled){border-color:var(--gold)} .mbtn:disabled{opacity:.35;cursor:default}
.mbtn.play{background:var(--navy);border-color:var(--navy);color:#fff}
#mapBox{position:relative;flex:1;min-width:0;display:grid;place-items:center;overflow:hidden}
#fit{position:relative;transition:opacity .3s;overflow:hidden;border-radius:6px}
#fit.fade{opacity:0}
#zoom{position:absolute;inset:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.25,.8,.25,1);--z:1}
@media (prefers-reduced-motion:reduce){#zoom{transition:none}}
#zoom img,#zoom svg{position:absolute;inset:0;width:100%;height:100%}
.route{fill:none;stroke:var(--gold-ink);stroke-width:calc(4px/var(--z,1));stroke-dasharray:9 9;stroke-linecap:round;opacity:.6}
.route-done{fill:none;stroke:var(--wine);stroke-width:calc(5px/var(--z,1));stroke-linecap:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.pt{cursor:pointer}
.pt circle{fill:var(--wine);stroke:#fbf5e7;stroke-width:calc(3px/var(--z,1));r:calc(15px/var(--z,1))}
.pt text{fill:#fff;font-size:calc(15px/var(--z,1));font-weight:800;text-anchor:middle;dominant-baseline:central}
.pt.done circle{fill:var(--gold)}
.pt.now circle{r:calc(19px/var(--z,1));stroke-width:calc(4px/var(--z,1))}
#pop{position:absolute;z-index:6;width:225px;background:var(--panel);border:1.5px solid var(--gold);border-radius:12px;
  box-shadow:0 10px 26px rgb(60 40 0/.3);overflow:hidden;opacity:0;pointer-events:none;transition:opacity .3s}
#pop.show{opacity:1}
#pop .ph{background:var(--wine);color:#fff;font-size:12.5px;font-weight:800;padding:6px 11px;display:flex;gap:7px;align-items:center}
#pop .ph i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--wine);
  font-style:normal;font-size:10.5px;font-weight:800;flex:none}
#pop .pl{font-size:11px;font-weight:700;color:var(--gold-ink);padding:6px 11px 0}
#pop .pd{font-size:11.5px;line-height:1.6;padding:2px 11px 9px;margin:0}
/* מקרא המקומות - טור אנכי בצד שמאל של המפה */
#legend{flex:none;width:var(--leg-w);display:flex;flex-direction:column;gap:5px;overflow-y:auto;
  padding:10px 9px;background:var(--panel);border-inline-end:1px solid var(--line);scrollbar-width:none}
#legend::-webkit-scrollbar{display:none}
.lg{flex:none;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:6px 9px;cursor:pointer;
  text-align:start;line-height:1.35;font-family:inherit}
.lg i{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--wine);color:#fff;
  font-style:normal;font-size:9.5px;font-weight:800;flex:none}
.lg.now{border-color:var(--gold)} .lg.now i{background:var(--gold)}
#noMap{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:rgb(239 228 203/.5);
  opacity:0;pointer-events:none;transition:opacity .3s}
#noMap.show{opacity:1}
#noMap span{background:var(--panel);border:1px dashed var(--gold);border-radius:12px;padding:10px 18px;font-size:13px;color:var(--muted)}

/* ===================== טור הסיפור ===================== */
/* RTL: inline-start = ימין - משאירים מקום לסרגל התקופות, וה-auto בצד השני דוחף ימינה */
#story{position:relative;z-index:10;width:var(--story-w);
  margin-inline-start:var(--era-w);margin-inline-end:auto;padding:calc(var(--bar) + 14px) 16px 62vh}
#story::before{content:'';position:absolute;top:0;bottom:0;inset-inline-end:12px;width:2px;background:var(--gold);opacity:.4}
/* סינון הסוגים - צמוד לראש הרשימה שהוא מסנן */
#filters{position:sticky;top:var(--bar);z-index:14;display:flex;gap:5px;flex-wrap:wrap;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 9px;margin:0 0 6px;
  box-shadow:0 3px 10px rgb(60 40 0 / .12)}
#filters .flab{font-size:10.5px;font-weight:700;color:var(--muted);margin-inline-end:2px}
.fbtn{flex:none;display:flex;align-items:center;justify-content:center;width:29px;height:29px;padding:0;
  border-radius:9px;font-size:14px;cursor:pointer;background:color-mix(in srgb, var(--kc) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--kc) 50%, transparent);color:var(--kc);transition:opacity .15s,filter .15s}
/* אמוג'י ותווים גיאומטריים באים מגופנים שונים - עוטפים ב-span עם קופסה נקייה
   כדי שכולם ימורכזו זהה, בלי הסטת קו-בסיס */
.fbtn .gl,.kicon .gl{display:block;line-height:1;font-size:1em;
  font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji','Segoe UI Symbol',sans-serif}
.fbtn[data-l="events"] .gl,.kicon.k-event .gl{font-size:.82em;transform:translateY(.02em)}
.fbtn[aria-pressed="false"]{opacity:.34;filter:grayscale(1)}
.fbtn:hover{opacity:1}
#filters .fcnt{margin-inline-start:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#filters .khint{flex:0 0 100%;font-size:10.5px;color:var(--muted);opacity:.8;margin-top:1px}
#filters .khint kbd{font:inherit;background:rgba(0,0,0,.05);border:1px solid var(--line);
  border-radius:4px;padding:0 4px;margin:0 1px}
@media (max-width:980px){#filters .khint{display:none}}
.ehead{position:sticky;top:calc(var(--bar) + var(--filt-h, 44px) + 10px);z-index:12;margin:22px 0 10px;width:fit-content;max-width:100%;
  background:var(--navy);color:#f4ecd8;font-size:13.5px;font-weight:800;border-radius:12px;padding:6px 14px;
  box-shadow:0 5px 16px rgb(10 20 40/.3)}
.ehead b{color:#d9b755}
.card{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;
  margin:0 0 10px;cursor:pointer;opacity:.55;transition:opacity .25s,border-color .25s,box-shadow .25s}
.card::after{content:'';position:absolute;top:17px;inset-inline-end:-10.5px;width:8px;height:8px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);transition:transform .25s,background .25s}
.card{display:flex;align-items:flex-start;gap:10px}
.cbody{flex:1;min-width:0}
/* אייקון הסוג - בצד ימין של הכרטיס (RTL: הילד הראשון) */
.kicon{flex:none;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;
  font-size:15px;background:color-mix(in srgb, var(--kc) 15%, transparent);
  border:1px solid color-mix(in srgb, var(--kc) 45%, transparent);color:var(--kc)}
.card h3{font-family:'Frank Ruhl Libre',serif;font-size:17px;font-weight:900;color:var(--navy);margin:0}
.card .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.card.on{opacity:1;border-color:var(--gold);box-shadow:0 7px 22px rgb(60 40 0/.16)}
.card.on::after{background:var(--wine);transform:scale(1.5)}
.card .more{display:none;font-size:12.5px;line-height:1.75;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.hidden{display:none !important}

/* ===================== שכבות-על ===================== */
.ov{position:fixed;inset:0;z-index:60;background:rgb(30 20 5/.5);display:flex;align-items:center;justify-content:center;padding:20px}
.ovpanel{background:var(--panel);border-radius:16px;border-top:4px solid var(--gold);max-width:min(680px,94vw);
  max-height:88vh;overflow-y:auto;padding:22px 24px;box-shadow:0 18px 50px rgb(40 25 0/.4);position:relative;width:100%}
.ovpanel h2{font-family:'Frank Ruhl Libre',serif;font-size:22px;color:var(--navy);margin:0 0 4px}
.ovpanel .osub{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.ovclose{position:absolute;left:14px;top:12px;border:none;background:none;font-size:17px;color:var(--muted);cursor:pointer}
.ovclose:hover{color:var(--ink)}
/* שכבות */
.lrow{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.lrow:last-child{border-bottom:none}
.lrow input{width:17px;height:17px;accent-color:var(--navy);cursor:pointer}
.lrow i{width:12px;height:12px;border-radius:3px;flex:none}
.lrow .cnt{margin-inline-start:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lquick{display:flex;gap:7px;margin-bottom:12px}
/* אילן */
.tflow{display:flex;flex-direction:column;align-items:center}
.tgen{display:flex;flex-direction:column;align-items:center;width:100%}
.tconn{width:2px;height:15px;background:var(--gold);opacity:.5}
.tnode{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;border-radius:9px;padding:5px 12px;
  border:1.5px solid var(--line);background:var(--bg);cursor:default;font-family:inherit}
.tnode .tn{font-weight:700;font-size:13.5px;color:var(--ink)}
.tnode .tr{font-size:10px;color:var(--muted)}
.tnode.link{cursor:pointer;border-color:var(--gold);background:linear-gradient(180deg,#fff9ec,#f2e4c4)}
.tnode.link:hover{transform:translateY(-1px)}
.tsp{display:flex;gap:5px;margin-top:5px}
.tnode.sp{padding:4px 10px} .tnode.sp .tn{font-size:12px}
.tsibs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:7px 10px;border:1px dashed var(--line);
  border-radius:10px;background:rgb(220 201 163/.15)}
.tnode.sib{opacity:.6;padding:4px 9px} .tnode.sib .tn{font-size:12px}
/* תובנות */
.icard{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.icard:first-of-type{border-top:none;padding-top:0;margin-top:0}
.icard h3{font-size:15px;color:var(--navy);margin:0 0 9px}
.jrow{margin-bottom:10px}
.jhead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.jbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.jbar span{display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.jbar .g{background:#4f7a33} .jbar .m{background:#b28a2b} .jbar .b{background:#b0392c}
.ilist{display:flex;flex-direction:column;gap:4px}
.ilrow{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:5px 10px;cursor:pointer;text-align:start;font-family:inherit;width:100%}
.ilrow:hover{border-color:var(--gold)}
.ilrow b{color:var(--navy);flex:1;min-width:0}
.ilrow span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.icounts{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:7px}
.icount{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 5px;text-align:center}
.icount b{display:block;font-size:20px;color:var(--navy);font-weight:900}
.icount span{font-size:10.5px;color:var(--muted)}
.idens{display:flex;align-items:flex-end;gap:2px;height:60px}
.idens i{flex:1;background:linear-gradient(180deg,var(--prophet),#d9b755);border-radius:2px 2px 0 0;min-height:2px}
.ipunch{margin:10px 0 0;font-size:12.5px;line-height:1.6;background:linear-gradient(180deg,#fff9ec,#f4e8cc);
  border-inline-start:3px solid var(--gold);border-radius:8px;padding:8px 11px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;
  font-size:13px;font-weight:700;border-radius:20px;padding:10px 20px;box-shadow:0 8px 24px rgb(10 20 40/.35);
  opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}

/* ===== מסכים בינוניים: מפנים מקום למפה - תקופות לרצועה עליונה, בלי מקרא צדי ===== */
@media (max-width:1400px){
  :root{--era-w:0px;--erabar:44px;--leg-w:0px}
  #eras{top:var(--bar);bottom:auto;inset-inline-start:0;width:100%;height:var(--erabar);
    flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 10px;gap:6px;
    border-inline-end:none;border-bottom:1px solid var(--line)}
  .echip{white-space:nowrap;padding:4px 11px;border-radius:14px}
  #legend{display:none}
  #mapPane,#detail{top:calc(var(--bar) + var(--erabar))}
  #story{margin-inline-start:0;padding-top:calc(var(--bar) + var(--erabar) + 14px)}
}

/* ===================== מובייל ===================== */
@media (max-width:980px){
  :root{--story-w:100%;--era-w:0px;--erabar:44px}
  /* המפה אינה תופסת מקום קבוע: היא נפתחת כשכבה מלאה מתוך הכרטיס */
  #mapPane{position:fixed;inset:0;top:0;left:0;width:100%;height:100%;z-index:60;display:none;
    border:none;border-bottom:none}
  body.map-open #mapPane{display:flex}
  #mapClose{display:inline-flex}
  /* הכרטיס נפתח כגיליון תחתון בלחיצה על פריט */
  #detail{display:block;position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:82vh;
    border-radius:16px 16px 0 0;border:none;border-top:4px solid var(--gold);z-index:45;
    transform:translateY(103%);transition:transform .26s ease;box-shadow:0 -10px 30px rgb(40 25 0 / .32)}
  body.sheet-open #detail{transform:none}
  #sheetBack{display:none;position:fixed;inset:0;background:rgb(30 20 5 / .42);z-index:44}
  body.sheet-open #sheetBack{display:block}
  #sheetClose{display:block}
  /* התקופות חוזרות לרצועה אופקית מתחת לסרגל */
  #eras{top:var(--bar);bottom:auto;inset-inline-start:0;width:100%;height:var(--erabar);
    flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 10px;gap:6px;
    border-inline-end:none;border-bottom:1px solid var(--line)}
  .echip{white-space:nowrap;padding:4px 11px;border-radius:14px}
  /* חלון המפה חייב למלא את מה שנותר מהמסך (ה-flex של הבסיס נשמר) */
  #mapBody{display:flex}
  #mapBox{flex:1;min-width:0}
  #mapHead{padding:6px 10px;gap:5px}
  #mapTitle{font-size:15px}
  .mbtn{font-size:11.5px;padding:5px 10px}
  #legend{display:none}
  /* הזרם האנכי תופס את כל המסך */
  #story{margin-inline-start:0;padding-top:calc(var(--bar) + var(--erabar) + 12px);padding-bottom:18vh}
  #filters{top:calc(var(--bar) + var(--erabar) + 4px)}
  .ehead{top:calc(var(--bar) + var(--erabar) + var(--filt-h, 44px) + 10px)}
  .card .more{display:none}
  #bar h1 span{display:none}
  #bar{padding:7px 10px;gap:7px}
  #bar h1{font-size:15.5px}
  #brand span{display:none}
  #pop{width:185px}
  .tool span.tl{display:none}
}
</style>
</head>
<body>

<header id="bar">
  <a id="brand" href="/" title="ציר הזמן של עם ישראל - לדף הבית">
    <h1>🗺️ מסע הדורות</h1>
    <span>ציר הזמן של עם ישראל</span>
  </a>
  <span class="spacer"></span>
  <div id="tools">
    <button class="tool" id="tTree">👑 <span class="tl">בית דוד</span></button>
    <button class="tool" id="tIns">📊 <span class="tl">תובנות</span></button>
    <button class="tool" id="tShare">🔗 <span class="tl">שיתוף</span></button>
    <a class="tool primary" id="toTimeline" href="/" title="מעבר לתצוגת ציר הזמן">📜 <span class="tl">ציר הזמן</span></a>
  </div>
</header>

<nav id="eras" aria-label="תקופות"></nav>
<div id="sheetBack"></div>
<aside id="detail" aria-label="פרטי הפריט">
  <button id="sheetClose" aria-label="סגירה">✕</button>
</aside>

<div id="mapPane">
  <div id="mapHead">
    <h2 id="mapTitle">מסע הדורות</h2>
    <div id="mapBtns">
      <button class="mbtn play" id="bPlay">▶ הפעלת המסע</button>
      <button class="mbtn" id="bPrev">הקודם</button>
      <button class="mbtn" id="bNext">הבא</button>
      <button class="mbtn" id="bAll" title="חזרה למבט על כל המסלול">סקירה כללית</button>
      <button class="mbtn" id="mapClose">✕ סגירת המפה</button>
    </div>
  </div>
  <div id="mapBody">
    <div id="mapBox">
      <div id="fit">
        <div id="zoom">
          <img src="/israel_map_square2.png" alt="מפת ארץ ישראל והמרחב"/>
          <svg id="ov" viewBox="0 0 1254 1254" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div id="pop"></div>
      </div>
      <div id="noMap"><span>לפריט זה אין מפת מסע</span></div>
    </div>
    <div id="legend"></div>
  </div>
</div>

<main id="story"></main>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const IMG = 1254;
const LAYERS = [
  { key:'leaders', label:'אבות ומנהיגים', color:'var(--leader)',  icon:'🏛️' },
  { key:'judges',  label:'שופטים',        color:'var(--judge)',   icon:'⚖️' },
  { key:'kings',   label:'מלכים',         color:'var(--judah)',   icon:'👑' },
  { key:'prophets',label:'נביאים',        color:'var(--prophet)', icon:'📜' },
  { key:'books',   label:'ספרי תנ״ך',     color:'var(--book)',    icon:'📖' },
  { key:'events',  label:'אירועים',       color:'var(--event)',   icon:'◆'  },
  { key:'world',   label:'רקע עולמי',     color:'var(--world)',   icon:'🌍' },
];
const KIND_COLOR = { leader:'var(--leader)', judge:'var(--judge)', united:'var(--united)', judah:'var(--judah)',
  israel:'var(--israel)', prophet:'var(--prophet)', book:'var(--book)', event:'var(--event)', world:'var(--world)' };
const KIND_ICON = { leader:'🏛️', judge:'⚖️', united:'👑', judah:'👑', israel:'👑',
  prophet:'📜', book:'📖', event:'◆', world:'🌍' };
const JUD = { good:"עשה הישר בעיני ה'", bad:"עשה הרע בעיני ה'", mixed:'מעורב' };
// חיצים כ-SVG (חסינים לשיקוף bidi): קודקוד מימין = מצביע ימינה, ולהפך
const chev = (d) => `<svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true"><path d="${d}"
  fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEV_R = chev('M9 4 L17 12 L9 20');
const CHEV_L = chev('M15 4 L7 12 L15 20');

let DATA = null, items = [], visible = [], active = -1, step = -1, playT = null;
// מרכז אזור התחנות בכל המסעות - נקודת העיגון הקבועה של חיתוך המפה, כך שגם
// כשהחלון חותך, התחנות (ולא הים הריק) נשארות בפריים. אותו מבט לכל הפריטים.
let ANCHOR = { x: IMG / 2, y: IMG / 2 };
let on = Object.fromEntries(LAYERS.map(l => [l.key, true]));
try { const s = JSON.parse(localStorage.getItem('atlas_layers')); if (s) on = { ...on, ...s }; } catch {}

// ==================== בנייה ====================
async function build() {
  DATA = await (await fetch('/atlas-data.json')).json();
  DATA.eras.forEach(e => e.items.forEach(it => items.push(it)));
  const P = items.filter(i => i.map).flatMap(i => i.map.points);
  if (P.length) ANCHOR = {
    x: (Math.min(...P.map(p => p.X)) + Math.max(...P.map(p => p.X))) / 2,
    y: (Math.min(...P.map(p => p.Y)) + Math.max(...P.map(p => p.Y))) / 2,
  };
  $('#eras').innerHTML = DATA.eras.map((e,i) => `<button class="echip" data-e="${i}">${e.title}</button>`).join('');
  // לחיצה על תקופה = מעבר לפריט הראשון שלה. (חישוב לפי כותרת התקופה אינו
  // אמין: היא sticky, ולכן ה-rect שלה הוא המיקום הנעוץ ולא המיקום בדף.)
  $('#eras').querySelectorAll('.echip').forEach(b => b.addEventListener('click', () => {
    const first = document.querySelector(`.card:not(.hidden)[data-era="${b.dataset.e}"]`);
    if (first) centerCard(first);
    else toast('אין פריטים גלויים בתקופה זו - בדקו את השכבות');
  }));
  syncBar();
  renderStory();
  balanceColumns(); fitMap();
  openFromUrl();
  if (new URLSearchParams(location.search).get('tour') === '1') setTimeout(startTour, 700);
  addEventListener('scroll', pick, { passive: true });
  setInterval(pick, 300);
  addEventListener('resize', () => {
    if (!isNarrow()) document.body.classList.remove('sheet-open', 'map-open');  // מצבי מובייל בלבד
    syncBar(); syncFilterHeight(); balanceColumns(); fitMap(); paint();
  });
  $('#mapClose').addEventListener('click', closeMap);
  $('#sheetBack').addEventListener('click', closeSheet);
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.querySelector('.ov')) return document.querySelectorAll('.ov').forEach(o => o.remove());
      if (document.body.classList.contains('map-open')) return closeMap();
      return closeSheet();
    }
    if (e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented) return;
    if (inField(e.target) || document.querySelector('.ov')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); navFigure(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); navFigure(-1); }
    else if (e.key === ' ' || e.key === 'Spacebar') {
      if (onControl(e.target)) return;                 // רווח מפעיל כפתור ממוקד
      e.preventDefault(); navEra(e.shiftKey ? -1 : 1);
    }
  });
}

function renderStory() {
  const html = [];
  let gi = 0;
  // שורת הסינון - יושבת בראש רשימת השמות, לא בסרגל העליון
  html.push(`<div id="filters"><span class="flab">הצג:</span>` +
    LAYERS.map(l => `<button class="fbtn" data-l="${l.key}" style="--kc:${l.color}"
      aria-pressed="${on[l.key]}" title="${l.label}"><span class="gl">${l.icon}</span></button>`).join('') +
    `<span class="fcnt" id="fcnt"></span>` +
    `<span class="khint"><kbd>↑</kbd><kbd>↓</kbd> מעבר בין דמויות · <kbd>רווח</kbd> מעבר בין תקופות</span></div>`);
  DATA.eras.forEach((era, ei) => {
    html.push(`<div class="ehead" id="eh-${ei}">✦ <b>${era.title}</b> · ${era.start}–${era.end}</div>`);
    era.items.forEach((it) => {
      const idx = items.indexOf(it);
      html.push(`<article class="card${on[it.layer] ? '' : ' hidden'}" data-i="${idx}" data-era="${ei}" data-layer="${it.layer}">
        <span class="kicon${it.kind==='event'?' k-event':''}" style="--kc:${KIND_COLOR[it.kind]}"
          title="${it.kindLabel}"><span class="gl">${KIND_ICON[it.kind]}</span></span>
        <div class="cbody">
          <h3>${it.name}</h3>
          <div class="sub">${it.kindLabel} · ${it.start}–${it.end}${it.approx ? ' ≈' : ''}</div>
          <div class="more">${it.verse ? `<i>„${it.verse}”</i><br/>` : ''}${it.desc.slice(0,190)}${it.desc.length>190?'…':''}</div>
        </div>
      </article>`);
      gi++;
    });
  });
  $('#story').innerHTML = html.join('');
  // בדסקטופ הלחיצה ממרכזת בציר; במובייל היא פותחת את הכרטיס כגיליון
  document.querySelectorAll('.card').forEach(el => el.addEventListener('click', () => {
    if (isNarrow()) openSheet(+el.dataset.i); else centerCard(el);
  }));
  $('#filters').querySelectorAll('.fbtn').forEach(b => b.addEventListener('click', () => {
    on[b.dataset.l] = !on[b.dataset.l];
    b.setAttribute('aria-pressed', on[b.dataset.l]);
    applyFilters();
  }));
  applyFilters();
}
function applyFilters() {
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('hidden', !on[c.dataset.layer]));
  try { localStorage.setItem('atlas_layers', JSON.stringify(on)); } catch {}
  refreshVisible();
  const n = document.querySelectorAll('.card:not(.hidden)').length;
  const f = $('#fcnt'); if (f) f.textContent = n + ' פריטים';
  syncFilterHeight();
}
// גובה שורת הסינון נמדד - כותרות התקופה נצמדות מתחתיה ולא עליה
function syncFilterHeight() {
  const el = $('#filters'); if (!el) return;
  document.documentElement.style.setProperty('--filt-h', Math.round(el.getBoundingClientRect().height) + 'px');
}
const refreshVisible = () => {
  visible = [...document.querySelectorAll('.card:not(.hidden)')];
  pick(true);
};
const isNarrow = () => matchMedia('(max-width:980px)').matches;
const focusLine = () => innerHeight * (isNarrow() ? .5 : .45);

// סימון הפריט הפעיל מיידית (בלי להמתין לסיום הגלילה) - כך ניווט המקלדת מגיב
// בלחיצה עצמה, ולא רק כשהכרטיס מגיע לקו הבחירה.
function markActive(i) {
  document.querySelectorAll('.card').forEach(el => el.classList.toggle('on', +el.dataset.i === i));
  active = i; render(); markEra(i);
}
// ===== מובייל: גיליון הכרטיס ושכבת המפה =====
function openSheet(i) {
  markActive(i);
  document.body.classList.add('sheet-open');
}
const closeSheet = () => document.body.classList.remove('sheet-open');
const openMap = () => { document.body.classList.add('map-open'); fitMap(); paint(); };
const closeMap = () => document.body.classList.remove('map-open');
// גובה הסרגל נמדד בפועל (הוא נשבר לשתי שורות במובייל) - כך הפריסה לא מתפספסת
function syncBar() {
  const h = Math.round($('#bar').getBoundingClientRect().height);
  document.documentElement.style.setProperty('--bar', h + 'px');
}
// גלילה חלקה משלנו - scrollTo({behavior:'smooth'}) אינו אמין בכל הסביבות.
// רשת ביטחון: אם rAF אינו רץ (למשל בלשונית שאינה מקומפזת), קופצים ליעד.
let animT = null, safeT = null, animDone = true;
function scrollToY(target) {
  cancelAnimationFrame(animT); clearTimeout(safeT);
  const max = document.documentElement.scrollHeight - innerHeight;
  const to = Math.max(0, Math.min(max, Math.round(target)));
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { scrollTo(0, to); pick(); return; }
  const from = scrollY, dist = to - from, t0 = performance.now();
  const dur = Math.min(650, 180 + Math.abs(dist) * .35);
  const ease = (t) => (t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2);
  animDone = false;
  const tick = (now) => {
    const t = Math.min(1, (now - t0) / dur);
    scrollTo(0, from + dist * ease(t));
    if (t < 1) { animT = requestAnimationFrame(tick); } else { animDone = true; pick(); }
  };
  animT = requestAnimationFrame(tick);
  safeT = setTimeout(() => { if (!animDone) { cancelAnimationFrame(animT); scrollTo(0, to); animDone = true; pick(); } }, dur + 140);
}
// כרטיסים בקצוות הדף אינם יכולים להגיע לקו הבחירה (הגלילה נחסמת) - במקרה
// כזה "נועצים" את הבחירה עליהם, והנעיצה משתחררת ברגע שהמשתמש גולל בעצמו.
let pinned = null;
['wheel', 'touchstart', 'keydown'].forEach((ev) =>
  addEventListener(ev, () => { pinned = null; }, { passive: true }));

// כניסה מציר הזמן או מקישור משותף: /atlas?sel=kind:id (גם id בלבד נתמך).
// אם הפריט מסונן החוצה, מדליקים את השכבה שלו כדי שהוא באמת ייראה.
// ==================== סיור קצר ====================
// מגיעים לכאן מ-/atlas?tour=1, כשהמבקר ביקש הדרכה במסך הפתיחה. זרקור על
// אזור אחד בכל פעם, במקום שקפים שמסתירים את המסך ומלמדים לפני שרואים.
// במסך צר הכרטיס והמפה נפתחים רק בהקשה, ולכן אין טעם להצביע עליהם - הם
// יושבים מתחת לקצה המסך. שם מסבירים אותם בתוך שלב הרשימה.
const TOUR_WIDE = [
  { sel: '#story', title: 'הסיפור נגלל', text: 'הדמויות והאירועים מסודרים לפי סדר הדורות. גללו, ולחצו על שם כדי לפתוח אותו.' },
  { sel: '#eras', title: 'קפיצה בין תקופות', text: 'סרגל התקופות. לחיצה מקפיצה לתחילת התקופה, ורווח במקלדת מדלג לבאה.' },
  { sel: '#filters', title: 'מה להציג', text: 'הדליקו וכבו סוגים - מלכים, נביאים, ספרים, אירועים - כדי לנקות את הרשימה.' },
  { sel: '#detail', title: 'הכרטיס המלא', text: 'הסיפור, הפסוק, המקורות, בני-הזמן, וקישור לאותה דמות על ציר הזמן.' },
  { sel: '#mapPane', title: 'המפה', text: 'למי שיש מסע - התחנות מסומנות על המפה, ואפשר להריץ אותו תחנה אחר תחנה.' },
];
const TOUR_NARROW = [
  { sel: '#story', title: 'הסיפור נגלל', text: 'הדמויות והאירועים לפי סדר הדורות. הקישו על שם כדי לפתוח את הכרטיס המלא - ובתוכו גם כפתור לפתיחת המפה.' },
  { sel: '#eras', title: 'קפיצה בין תקופות', text: 'סרגל התקופות. הקשה מקפיצה לתחילת התקופה שבחרתם.' },
  { sel: '#filters', title: 'מה להציג', text: 'הדליקו וכבו סוגים - מלכים, נביאים, ספרים, אירועים - כדי לנקות את הרשימה.' },
];
let TOUR = TOUR_WIDE, tourStep = 0;
function startTour() { TOUR = isNarrow() ? TOUR_NARROW : TOUR_WIDE; tourStep = 0; showTourStep(); }
function endTour() {
  document.querySelector('.tour-wrap')?.remove();
  history.replaceState({}, '', location.pathname + location.search.replace(/[?&]tour=1/, '').replace(/^&/, '?'));
}
function showTourStep() {
  document.querySelector('.tour-wrap')?.remove();
  const s = TOUR[tourStep];
  if (!s) return endTour();
  const el = document.querySelector(s.sel);
  if (!el) { tourStep++; return showTourStep(); }        // אזור שאינו מוצג במסך הזה
  const r0 = el.getBoundingClientRect();
  if (r0.width < 8 || r0.height < 8) { tourStep++; return showTourStep(); }
  // חותכים לגבולות החלון: אזורים רחבים (המפה) גולשים החוצה, והטבעת נראית קטועה.
  // clientWidth ולא innerWidth - האחרון כולל את פס הגלילה, והשכבה (inset:0) לא.
  const VW = document.documentElement.clientWidth, VH = document.documentElement.clientHeight;
  // יעד שנמצא מחוץ למסך (למשל גיליון סגור) - מדלגים, אחרת החיתוך שלמטה היה
  // מצייר טבעת סביב שטח ריק.
  if (r0.bottom < 24 || r0.top > VH - 24 || r0.right < 24 || r0.left > VW - 24) {
    tourStep++; return showTourStep();
  }
  const pad = 6, M = 4;
  const b = {
    left: Math.max(M, r0.left - pad), right: Math.min(VW - M, r0.right + pad),
    top: Math.max(M, r0.top - pad), bottom: Math.min(VH - M, r0.bottom + pad),
  };
  b.width = b.right - b.left; b.height = b.bottom - b.top;
  const wrap = document.createElement('div');
  wrap.className = 'tour-wrap';
  wrap.innerHTML =
    `<div class="tour-ring" style="top:${b.top}px;right:${VW - b.right}px;
       width:${b.width}px;height:${b.height}px"></div>
     <div class="tour-box">
       <b>${s.title}</b><p>${s.text}</p>
       <div class="tour-nav">
         <span>${tourStep + 1}/${TOUR.length}</span>
         <button class="tskip">דילוג</button>
         <button class="tnext primary">${tourStep === TOUR.length - 1 ? 'סיום' : 'הבא'}</button>
       </div>
     </div>`;
  document.body.appendChild(wrap);
  // התיבה יושבת בצד הפנוי הגדול יותר כדי שלא תכסה את מה שהיא מסבירה; אם אין
  // צד פנוי (המפה תופסת כמעט הכול) היא יורדת לתחתית האזור.
  const box = wrap.querySelector('.tour-box');
  const bw = box.offsetWidth, bh = box.offsetHeight;
  const clampTop = (v) => Math.min(Math.max(12, v), VH - bh - 12);
  const freeR = VW - b.right, freeL = b.left;
  if (freeR >= freeL && freeR > bw + 20) { box.style.right = (freeR + 14) + 'px'; box.style.top = clampTop(b.top) + 'px'; }
  else if (freeL > bw + 20) { box.style.right = (VW - b.left + 14) + 'px'; box.style.top = clampTop(b.top) + 'px'; }
  else {
    box.style.right = Math.max(12, VW - b.right + (b.width - bw) / 2) + 'px';
    box.style.top = clampTop(b.bottom - bh - 14) + 'px';
  }
  wrap.querySelector('.tnext').addEventListener('click', () => { tourStep++; showTourStep(); });
  wrap.querySelector('.tskip').addEventListener('click', endTour);
  wrap.addEventListener('click', (e) => { if (e.target === wrap) endTour(); });
}

// מעבר לפריט לפי אינדקס, גם אם השכבה שלו מסוננת כרגע - אחרת הקישור "נבלע"
function goIndex(i) {
  if (i < 0 || !items[i]) return;
  if (!on[items[i].layer]) {
    on[items[i].layer] = true;
    $('#filters').querySelector(`.fbtn[data-l="${items[i].layer}"]`)?.setAttribute('aria-pressed', 'true');
    applyFilters();
  }
  const el = document.querySelector(`.card[data-i="${i}"]`);
  if (el) { navIdx = visible.indexOf(el); goCard(el); }
}

function openFromUrl() {
  const sel = new URLSearchParams(location.search).get('sel');
  if (!sel) return;
  const id = sel.includes(':') ? sel.split(':')[1] : sel;
  const i = items.findIndex(x => x.id === id);
  if (i < 0) return;
  if (!on[items[i].layer]) {
    on[items[i].layer] = true;
    $('#filters').querySelector(`.fbtn[data-l="${items[i].layer}"]`)?.setAttribute('aria-pressed', 'true');
    applyFilters();
  }
  // הפריסה ממשיכה לזוז אחרי הטעינה (פונטים, גובה המפה), ולכן יעד שחושב מוקדם
  // מדי נוחת על כרטיס שכן. קופצים אחרי שהפונטים מוכנים, ומיישרים שוב ברגע
  // שהפריסה נרגעה - כל עוד המשתמש לא גלל בעצמו בינתיים.
  const jump = () => {
    const el = document.querySelector(`.card[data-i="${i}"]`);
    if (el) goCard(el);
  };
  let moved = false;
  const mark = () => { moved = true; };
  ['wheel', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, mark, { passive: true }));
  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(() => setTimeout(jump, 60));
  setTimeout(() => {
    if (!moved) jump();
    ['wheel', 'touchstart', 'keydown'].forEach(ev => removeEventListener(ev, mark));
  }, 700);
}

// ==================== ניווט במקלדת ====================
// ↓/↑ = דמות אחת בכל לחיצה. רווח = התקופה הבאה, Shift+רווח = הקודמת.
// navIdx מחזיק את היעד שנבחר זה עתה, כדי שלחיצות רצופות ימשיכו קדימה גם
// בזמן שאנימציית הגלילה עדיין רצה (active מתעדכן רק בסופה).
let navIdx = null;
['wheel', 'touchstart'].forEach((ev) =>
  addEventListener(ev, () => { navIdx = null; }, { passive: true }));

function goCard(el) {
  if (!el) return;
  const i = +el.dataset.i;
  if (isNarrow()) { openSheet(i); el.scrollIntoView({ block: 'center' }); }
  else { markActive(i); centerCard(el); }
}
function navFigure(dir) {
  if (!visible.length) return;
  const at = navIdx !== null ? navIdx : visible.findIndex(el => +el.dataset.i === active);
  const to = at < 0 ? (dir > 0 ? 0 : visible.length - 1)
                    : Math.min(visible.length - 1, Math.max(0, at + dir));
  navIdx = to;
  goCard(visible[to]);
}
function navEra(dir) {
  if (!visible.length) return;
  const at = navIdx !== null ? navIdx : visible.findIndex(el => +el.dataset.i === active);
  const ei = at >= 0 ? +visible[at].dataset.era : 0;
  for (let e = ei + dir; e >= 0 && e < DATA.eras.length; e += dir) {
    const first = visible.find(el => +el.dataset.era === e);   // תקופות ריקות מדולגות
    if (first) { navIdx = visible.indexOf(first); return goCard(first); }
  }
  toast(dir > 0 ? 'זו התקופה האחרונה' : 'זו התקופה הראשונה');
}
const inField = (t) => !!t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
// רווח על כפתור ממוקד צריך להפעיל אותו (נגישות) - לכן מדלגים על פקדים. כדי
// שקליק-עכבר לא ישאיר מיקוד תקוע על כפתור, מסירים אותו אחרי לחיצת עכבר בלבד.
const onControl = (t) => !!t && !!t.closest?.('button,a,[role="button"]');
addEventListener('mouseup', (e) => { const b = e.target.closest?.('button'); if (b) b.blur(); });

function centerCard(el) {
  const b = el.getBoundingClientRect();
  const want = scrollY + b.top + b.height / 2 - focusLine();
  const max = document.documentElement.scrollHeight - innerHeight;
  const to = Math.max(0, Math.min(max, want));
  pinned = Math.abs(to - want) > 2 ? +el.dataset.i : null;
  scrollToY(to);
  if (pinned !== null) pick(true);
}

// ==================== מפה ====================
// המפה ריבועית, ולכן בחלון רחב-ונמוך נותרים שוליים ריקים בצדדים. מרחיבים את
// עמודת הפירוט כדי לצמצם את חלון המפה לריבוע - כך המפה ממלאת את מלוא רוחבו.
// מצמצמים את חלון המפה לריבוע (עד גבול סביר) כדי שהמפה הריבועית תמלא אותו -
// העודף עובר לעמודת הפירוט, אך היא לא גדלה מעבר ל-430px.
// חלון המפה מכוון להיות ריבועי (כגובהו) כדי שהמפה הריבועית תמלא אותו בלי
// שוליים; מה שנותר אחרי המקרא, השמות והתקופות עובר לעמודת הפירוט.
function balanceColumns() {
  const root = document.documentElement;
  if (isNarrow()) { root.style.removeProperty('--detail-w'); root.style.removeProperty('--map-w'); return; }
  const boxH = $('#mapBody').getBoundingClientRect().height;
  const storyW = $('#story').getBoundingClientRect().width;
  // נקראים מהמשתנים ולא נמדדים: במצב רצועה אופקית סרגל התקופות תופס 100% רוחב
  const cssVar = (n) => parseFloat(getComputedStyle(root).getPropertyValue(n)) || 0;
  const legW = cssVar('--leg-w'), erasW = cssVar('--era-w');
  // clientWidth ולא innerWidth - האחרון כולל את פס הגלילה וגורם לחפיפת עמודות
  const free = document.documentElement.clientWidth - storyW - erasW;
  let mapW = Math.min(boxH + legW, free - 320);        // חלון ריבועי, אך משאירים לפירוט
  mapW = Math.max(430, Math.min(mapW, free - 300));
  root.style.setProperty('--map-w', Math.round(mapW) + 'px');
  root.style.setProperty('--detail-w', Math.round(free - mapW) + 'px');
}
// המפה ממלאת את החלון לגמרי (cover) - בלי שום רווח, גם ביחס מסך שונה.
// העודף נחתך; החלון מכוון להיות ריבועי ולכן החיתוך זעיר.
function fitMap() {
  const box = $('#mapBox').getBoundingClientRect();
  const s = Math.max(box.width / IMG, box.height / IMG);
  const f = $('#fit');
  f.style.width = IMG * s + 'px'; f.style.height = IMG * s + 'px'; f.dataset.s = s;
}
const line = (pts) => pts.length < 2 ? '' : 'M ' + pts.map(p => `${p.X} ${p.Y}`).join(' L ');

// המבט הנוכחי והפריט הנבחר נשמרים בכתובת, כדי שמעבר לציר הזמן (ושיתוף)
// ינחתו על אותה דמות ולא בראש הדף.
function syncViewLink() {
  const it = items[active];
  const q = it ? `?sel=${it.kind}:${it.id}` : '';
  const a = $('#toTimeline');
  if (a) {
    a.href = '/' + q;
    a.title = it ? `הצגת ${it.name} על ציר הזמן` : 'מעבר לתצוגת ציר הזמן';
  }
  try { history.replaceState({}, '', '/atlas' + q); } catch {}
}

function render() {
  const it = items[active], ov = $('#ov'), lg = $('#legend');
  syncViewLink();
  stopPlay(); renderDetail(it);
  if (!it || !it.map) {
    ov.innerHTML = ''; lg.innerHTML = '';
    $('#mapTitle').textContent = it ? it.name : 'מסע הדורות';
    $('#noMap').classList.toggle('show', !!(it && !it.map));
    $('#pop').classList.remove('show');
    fitMap(); zoomTo(-1);   // המקרא התרוקן - החלון גדל, מתאימים מחדש
    ['bPlay','bPrev','bNext','bAll'].forEach(id => $('#'+id).disabled = true);
    return;
  }
  $('#noMap').classList.remove('show');
  $('#bPlay').disabled = false;
  $('#mapTitle').textContent = it.map.title;
  const pts = it.map.points;
  ov.innerHTML = `<path class="route" d="${line(pts)}"/><path class="route-done" d="${line(pts)}"/>` +
    pts.map((p,i) => `<g class="pt" data-p="${i}" transform="translate(${p.X} ${p.Y})"><circle/><text>${p.n}</text></g>`).join('');
  const done = ov.querySelector('.route-done');
  const len = done.getTotalLength(); done.style.setProperty('--len', len); done.dataset.len = len;
  lg.innerHTML = pts.map((p,i) => `<button class="lg" data-p="${i}"><i>${p.n}</i>${p.name}</button>`).join('');
  ov.querySelectorAll('.pt').forEach(g => g.addEventListener('click', () => setStep(+g.dataset.p, true)));
  lg.querySelectorAll('.lg').forEach(b => b.addEventListener('click', () => setStep(+b.dataset.p, true)));
  fitMap();   // המקרא נטען ושינה את גובה החלון - מתאימים אחריו
  step = -1; paint();
}

// סקירה = אותו מבט קבוע לכל פריט (כל המפה, בלי תזוזה). רק במסע מתקרבים
// לתחנה - וההצמדה לשולי התמונה מבטיחה שלא ייחשף שטח שאין בו מפה: תחנה בפינה
// נשארת בפינה במקום להתמרכז ולגרור את המפה החוצה.
function zoomTo(i) {
  const z = $('#zoom'), s = +$('#fit').dataset.s || 1, it = items[active];
  const box = $('#mapBox').getBoundingClientRect();
  const w = IMG * s;
  const offX = (box.width - w) / 2, offY = (box.height - w) / 2;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  if (i < 0 || !it || !it.map) {
    // סקירה: בדסקטופ מבט קבוע לכולם (מעוגן על מרכז אזור התחנות הכללי).
    // במובייל המפה נפתחת עבור פריט מסוים ובחיתוך צר, ולכן ממסגרים את מסעו.
    let ax = ANCHOR.x, ay = ANCHOR.y;
    if (isNarrow() && it && it.map) {
      const xs = it.map.points.map(p => p.X), ys = it.map.points.map(p => p.Y);
      ax = (Math.min(...xs) + Math.max(...xs)) / 2;
      ay = (Math.min(...ys) + Math.max(...ys)) / 2;
    }
    const ox = clamp(box.width / 2 - offX - ax * s, box.width - w - offX, -offX);
    const oy = clamp(box.height / 2 - offY - ay * s, box.height - w - offY, -offY);
    z.style.transform = `translate(${ox}px, ${oy}px) scale(1)`;
    z.style.setProperty('--z', 1);
    return { Z: 1, tx: ox, ty: oy, offX, offY };
  }
  const Z = isNarrow() ? 1.7 : 2.1;
  const p = it.map.points[i];
  const tx = clamp(box.width / 2 - offX - p.X * s * Z, box.width - w * Z - offX, -offX);
  const ty = clamp(box.height / 2 - offY - p.Y * s * Z, box.height - w * Z - offY, -offY);
  z.style.transform = `translate(${tx}px, ${ty}px) scale(${Z})`;
  z.style.setProperty('--z', Z);
  return { Z, tx, ty, offX, offY };
}

function paint() {
  const it = items[active]; if (!it || !it.map) return;
  const pts = it.map.points, ov = $('#ov');
  ov.querySelectorAll('.pt').forEach(g => {
    const i = +g.dataset.p;
    g.classList.toggle('done', step >= 0 && i < step);
    g.classList.toggle('now', i === step);
  });
  $('#legend').querySelectorAll('.lg').forEach(b => b.classList.toggle('now', +b.dataset.p === step));
  const done = ov.querySelector('.route-done'), len = +done.dataset.len || 0;
  done.style.strokeDashoffset = step <= 0 ? len : len * (1 - step/(pts.length-1));
  $('#bAll').disabled = step < 0; $('#bPrev').disabled = step < 0; $('#bNext').disabled = step >= pts.length-1;
  const cam = zoomTo(step);
  const pop = $('#pop');
  if (step < 0) { pop.classList.remove('show'); return; }
  const p = pts[step], s = +$('#fit').dataset.s || 1;
  pop.innerHTML = `<div class="ph"><i>${p.n}</i>${p.name}</div><div class="pl">${p.label||''}</div>
    <p class="pd">${(p.desc||'').slice(0,150)}${(p.desc||'').length>150?'…':''}</p>`;
  // מיקום התחנה בקואורדינטות ה-fit, ותיחום לאזור הנראה בפועל (התמונה חתוכה)
  const box = $('#mapBox').getBoundingClientRect();
  const fx = cam.Z*(p.X*s)+cam.tx, fy = cam.Z*(p.Y*s)+cam.ty;
  const visL = -cam.offX, visT = -cam.offY;
  const cl = (v,lo,hi) => Math.min(hi, Math.max(lo, v));
  pop.style.left = cl(fx-112, visL+6, visL+box.width-231) + 'px';
  pop.style.top  = cl(fy > visT+box.height*.55 ? fy-150 : fy+30, visT+6, visT+box.height-155) + 'px';
  pop.classList.add('show');
}
function setStep(i, manual) {
  if (manual) stopPlay();
  const it = items[active]; if (!it || !it.map) return;
  step = Math.max(-1, Math.min(it.map.points.length-1, i)); paint();
}
function stopPlay(){ if (playT) { clearInterval(playT); playT = null; $('#bPlay').textContent = '▶ הפעלת המסע'; } }
$('#bPlay').addEventListener('click', () => {
  if (playT) return stopPlay();
  const it = items[active]; if (!it || !it.map) return;
  if (step >= it.map.points.length-1) step = -1;
  setStep(step+1); $('#bPlay').textContent = '⏸ השהיה';
  playT = setInterval(() => { if (step >= it.map.points.length-1) return stopPlay(); setStep(step+1); }, 2600);
});
$('#bNext').addEventListener('click', () => setStep(step+1, true));
$('#bPrev').addEventListener('click', () => setStep(step-1, true));
$('#bAll').addEventListener('click', () => setStep(-1, true));

// ==================== פאנל הפירוט ====================
// חפיפה בזמן - אותה הגדרה כמו "בני-הזמן" בציר הזמן
function overlapsTime(a, b) {
  if (a.start === a.end) return a.start >= b.start && a.start <= b.end;
  if (b.start === b.end) return b.start >= a.start && b.start <= a.end;
  return a.start < b.end && a.end > b.start;
}
// הגשר למבט השני: מי חי לצד הדמות הזו - שאלה שציר הזמן עונה עליה טוב יותר.
// כאן מציגים טעימה, והקישור פותח את הציר עם בני-הזמן כבר מודגשים.
function bridgeHtml(it) {
  const ctp = items.filter(o => o !== it && overlapsTime(it, o)).sort((a, b) => a.start - b.start);
  const shown = ctp.slice(0, 8);
  return `<div class="bridge">
    ${shown.length ? `<h3>בני-הזמן <span>${ctp.length}</span></h3>
    <div class="bchips">${shown.map(o =>
      // האייקון ולא נקודת צבע: יש שמות שחוזרים בין סוגים (ישעיהו הנביא מול
      // ספר ישעיהו), והצבע לבדו אינו מבחין ביניהם.
      `<button class="bchip" data-go="${items.indexOf(o)}" title="${o.kindLabel} · ${o.start}–${o.end}">
         <i style="color:${KIND_COLOR[o.kind]}">${KIND_ICON[o.kind]}</i>${o.name}</button>`).join('')}</div>` : ''}
    <a class="blink" href="/?sel=${it.kind}:${it.id}&contemp=1">📜 ${shown.length ? 'הצגת כולם על ציר הזמן' : 'הצגה על ציר הזמן'} ←</a>
    <a class="blink ghost" href="/p/${it.kind}/${it.id}">📖 דף המידע המלא של ${it.name} ←</a>
  </div>`;
}

function renderDetail(it) {
  const d = $('#detail'); if (!d) return;
  if (!it) { d.innerHTML = ''; return; }
  const vi = visible.indexOf(document.querySelector(`.card[data-i="${active}"]`));
  const prev = vi > 0 ? visible[vi-1] : null, next = vi >= 0 && vi < visible.length-1 ? visible[vi+1] : null;
  const nm = (el) => el ? items[+el.dataset.i].name : '';
  d.innerHTML =
    `<button id="sheetClose" aria-label="סגירה">✕</button>
     <span class="kind" style="background:${KIND_COLOR[it.kind]}">${it.kindLabel}</span>
     <h2>${it.name}</h2>
     <div class="yrs">${it.start}–${it.end}${it.approx ? ' <span class="approx">· ≈ משוער</span>' : ''}</div>` +
    (it.judgment ? `<div class="jud ${it.judgment}">${JUD[it.judgment]}</div>` : '') +
    (it.meta.length ? `<div class="meta">${it.meta.join(' · ')}</div>` : '') +
    (it.map ? `<button id="dMap">🗺️ פתיחת מפת המסע</button>` : '') +
    (it.verse ? `<div class="verse"><p>„${it.verse}”</p>${it.vref?`<small>${it.vref}</small>`:''}</div>` : '') +
    (it.desc ? `<p class="desc">${it.desc}</p>` : '') +
    (it.src ? `<div class="src"><b>מקור:</b> ${it.src}</div>` : '') +
    bridgeHtml(it) +
    // חיצי SVG ולא תווי ‹ › - האחרונים ממוסכים ע"י ה-bidi ב-RTL ומתהפכים.
    // מוקדם יותר = ימינה (הזמן זורם ימין→שמאל), מאוחר יותר = שמאלה.
    `<div class="nav">
       <button id="dPrev" ${prev?'':'disabled'} title="מוקדם יותר">${CHEV_R}<span>${nm(prev)||'-'}</span></button>
       <button id="dNext" ${next?'':'disabled'} title="מאוחר יותר"><span>${nm(next)||'-'}</span>${CHEV_L}</button>
     </div>`;
  d.scrollTop = 0;
  const go = (el) => { if (isNarrow()) openSheet(+el.dataset.i); else centerCard(el); };
  if (prev) $('#dPrev').addEventListener('click', () => go(prev));
  if (next) $('#dNext').addEventListener('click', () => go(next));
  $('#sheetClose')?.addEventListener('click', closeSheet);
  $('#dMap')?.addEventListener('click', openMap);
  d.querySelectorAll('.bchip').forEach(b => b.addEventListener('click', () => goIndex(+b.dataset.go)));
}

// ==================== גלילה חד-ערכית ====================
const markEra = (idx) => {
  const card = document.querySelector(`.card[data-i="${idx}"]`);
  const ei = card ? +card.dataset.era : 0;
  $('#eras').querySelectorAll('.echip').forEach(b => b.classList.toggle('on', +b.dataset.e === ei));
};
function pick(force) {
  if (!visible.length) return;
  const mid = focusLine();
  let cur = +visible[0].dataset.i, best = Infinity;
  visible.forEach(el => {
    const b = el.getBoundingClientRect();
    const d = Math.abs((b.top+b.bottom)/2 - mid);
    if (d < best) { best = d; cur = +el.dataset.i; }
  });
  // במובייל הבחירה נעשית בהקשה ולא בגלילה - הגלילה רק מסמנת את התקופה,
  // אחרת היא הייתה דורסת את הפריט שנפתח בגיליון. כשהגיליון פתוח, הסימון
  // נשאר על תקופת הפריט שנפתח.
  if (isNarrow()) {
    if (!document.body.classList.contains('sheet-open')) markEra(cur);
    return;
  }
  if (pinned !== null) cur = pinned;            // בחירה נעוצה גוברת
  else if (scrollY <= 2) cur = +visible[0].dataset.i;  // בראש הדף - הפריט הראשון
  if (cur === active && !force) return;
  active = cur;
  document.querySelectorAll('.card').forEach(el => el.classList.toggle('on', +el.dataset.i === active));
  markEra(active);
  const f = $('#fit'); f.classList.add('fade');
  setTimeout(() => { render(); f.classList.remove('fade'); }, 170);
}

// ==================== שכבות-על ====================
const overlay = (title, sub, body) => {
  const el = document.createElement('div');
  el.className = 'ov';
  el.innerHTML = `<div class="ovpanel"><button class="ovclose" aria-label="סגירה">✕</button>
    <h2>${title}</h2><p class="osub">${sub}</p>${body}</div>`;
  el.addEventListener('click', (e) => { if (e.target === el || e.target.classList.contains('ovclose')) el.remove(); });
  document.body.appendChild(el);
  return el;
};
const jumpToId = (id) => {
  const i = items.findIndex(x => x.id === id);
  if (i < 0) return false;
  const card = document.querySelector(`.card[data-i="${i}"]`);
  if (!card || card.classList.contains('hidden')) return false;
  document.querySelectorAll('.ov').forEach(o => o.remove());
  centerCard(card);
  return true;
};

$('#tTree').addEventListener('click', () => {
  const node = (n, cls) => `<button class="tnode ${cls}${n.id?' link':''}" ${n.id?`data-id="${n.id}"`:''}>
    <span class="tn">${cls==='sp'?'⚭ ':''}${n.name}</span>${n.role?`<span class="tr">${n.role}</span>`:''}
    ${n.note?`<span class="tr">${n.note}</span>`:''}</button>`;
  const body = '<div class="tflow">' + DATA.genealogy.map((g,i) => {
    const main = node(g.main,'heir') + (g.main.spouses ? `<div class="tsp">${g.main.spouses.map(s=>node(s,'sp')).join('')}</div>` : '');
    const sibs = g.siblings ? `<div class="tsibs">${g.siblings.map(s=>node(s,'sib')).join('')}</div><div class="tconn"></div>` : '';
    return `<div class="tgen">${i>0?'<div class="tconn"></div>':''}${sibs}${main}</div>`;
  }).join('') + '</div>';
  const el = overlay('👑 אילן היוחסין של בית דוד', 'מאברהם אבינו עד מלכי יהודה - לחיצה על שם מודגש קופצת אליו', body);
  el.querySelectorAll('.tnode.link').forEach(b => b.addEventListener('click', () => {
    if (!jumpToId(b.dataset.id)) toast('הפריט מוסתר - הפעילו את השכבה המתאימה');
  }));
});

$('#tIns').addEventListener('click', () => {
  const I = DATA.insights;
  const bar = (lab, d, av) => `<div class="jrow"><div class="jhead"><b>${lab}</b>
    <span>${d.total} מלכים · ${av} שנה בממוצע</span></div><div class="jbar">
    ${d.g?`<span class="g" style="flex:${d.g}">${d.g}</span>`:''}${d.m?`<span class="m" style="flex:${d.m}">${d.m}</span>`:''}
    ${d.b?`<span class="b" style="flex:${d.b}">${d.b}</span>`:''}</div></div>`;
  const rows = (arr, unit) => `<div class="ilist">${arr.map(x =>
    `<button class="ilrow" data-id="${x.id}"><b>${x.name}</b><span>${x.dur ?? x.span} ${unit}</span></button>`).join('')}</div>`;
  const body =
    `<div class="icard"><h3>מלכים - הישר מול הרע</h3>${bar('יהודה', I.judah, I.avgJudah)}${bar('ישראל', I.israel, I.avgIsrael)}
      <p class="ipunch">ביהודה ${I.judah.g} מלכים עשו הישר בעיני ה׳ מתוך ${I.judah.total}; בישראל - ${I.israel.g} מתוך ${I.israel.total}.</p></div>
     <div class="icard"><h3>המלכויות הארוכות ביותר</h3>${rows(I.longest,'שנה')}</div>
     <div class="icard"><h3>צפיפות הנביאים לאורך הזמן</h3>
       <div class="idens">${I.density.map(d=>`<i style="height:${Math.round(d.n/I.maxDensity*100)}%" title="${d.y}: ${d.n}"></i>`).join('')}</div>
       <p class="ipunch">השיא: ${I.peak.n} נביאים במקביל סביב שנת ${I.peak.year}.</p></div>
     <div class="icard"><h3>הנביאים עם הקריירה הארוכה</h3>${rows(I.longestProphets,'שנה')}</div>
     <div class="icard"><h3>הספרים המשתרעים על הזמן הרב ביותר</h3>${rows(I.longestBooks,'שנה')}</div>
     <div class="icard"><h3>במספרים</h3><div class="icounts">${Object.entries(I.counts).map(([k,v])=>
       `<div class="icount"><b>${v}</b><span>${k}</span></div>`).join('')}</div></div>`;
  const el = overlay('📊 תובנות', 'כל המספרים מחושבים מהנתונים עצמם', body);
  el.querySelectorAll('.ilrow').forEach(b => b.addEventListener('click', () => {
    if (!jumpToId(b.dataset.id)) toast('הפריט מוסתר - הפעילו את השכבה המתאימה');
  }));
});

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400);
}
$('#tShare').addEventListener('click', async () => {
  const it = items[active];
  const url = location.origin + '/atlas' + (it ? `?sel=${it.kind}:${it.id}` : '');
  const title = it ? `${it.name} - מסע הדורות` : 'מסע הדורות';
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
    await navigator.clipboard.writeText(url); toast('הקישור הועתק ✓');
  } catch { toast('העתיקו מהכתובת שלמעלה'); }
});

build();
</script>
</body>
</html>

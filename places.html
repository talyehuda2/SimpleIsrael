<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>מפת המקומות: איפה קרתה ההיסטוריה - ציר הזמן של עם ישראל</title>
<meta name="description" content="הציר השלישי: לא לפי זמן ולא לפי דמות, אלא לפי מקום. 136 מקומות בארץ ובסביבותיה, ומי עבר בכל אחד מהם - מאברהם ועד שיבת ציון."/>
<link rel="canonical" href="https://simpleisrael.co.il/places"/>
<meta name="theme-color" content="#fbf5e7"/>
<link rel="icon" href="/icons/icon-192.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="ציר הזמן של עם ישראל"/>
<meta property="og:locale" content="he_IL"/>
<meta property="og:url" content="https://simpleisrael.co.il/places"/>
<meta property="og:title" content="מפת המקומות - איפה קרתה ההיסטוריה"/>
<meta property="og:description" content="136 מקומות בארץ ובסביבותיה, ומי עבר בכל אחד מהם - מאברהם ועד שיבת ציון."/>
<meta property="og:image" content="https://simpleisrael.co.il/og/atlas.jpg"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="מפת המקומות - איפה קרתה ההיסטוריה"/>
<meta name="twitter:description" content="136 מקומות בארץ ובסביבותיה, ומי עבר בכל אחד מהם."/>
<meta name="twitter:image" content="https://simpleisrael.co.il/og/atlas.jpg"/>
<link rel="stylesheet" href="/src/places/places.css"/>
</head>
<body>

<header id="bar">
  <div id="brandWrap">
    <a id="brand" href="/" title="ציר הזמן של עם ישראל - לדף הבית">
      <h1>📍 מפת המקומות</h1>
    </a>
    <span class="title-icons">
      <button class="title-ico" id="mAbout" title="אודות הפרויקט" aria-label="אודות הפרויקט">ℹ️</button>
    </span>
  </div>
  <div class="mode-switch" role="group" aria-label="מצב תצוגה">
    <a class="ms-opt" href="/" title="מי חי מתי, ומי לצד מי">📜 ציר הזמן</a>
    <a class="ms-opt" href="/atlas" title="דמות אחר דמות, עם המפה והסיפור לצדה">🗺️ מסע הדורות</a>
    <span class="ms-opt on" aria-current="page">📍 מקומות</span>
  </div>
  <div id="barEnd">
    <div id="tools">
      <!-- אותו אייקון שיתוף של ציר הזמן ומסע הדורות -->
      <button class="tool" id="tShare" title="שיתוף">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81A3 3 0 1 0 6 15c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/></svg>
        <span class="tl">שיתוף</span>
      </button>
    </div>
  </div>
</header>

<nav id="modeNav" aria-label="מצבי תצוגה">
  <a class="mn-tab" href="/">📜 ציר הזמן</a>
  <a class="mn-tab" href="/atlas">🗺️ מסע הדורות</a>
  <span class="mn-tab on" aria-current="page">📍 מקומות</span>
</nav>

<main id="wrap">
  <!-- הרשימה בימין (כיוון הקריאה) והמפה לצדה, כמו סדר העמודות במסע הדורות -->
  <aside id="side" aria-label="רשימת המקומות">
    <div id="sideHead">
      <div id="searchRow">
        <input id="q" type="search" autocomplete="off" placeholder="חיפוש מקום…" aria-label="חיפוש מקום"/>
      </div>
      <div id="eras" role="group" aria-label="סינון לפי תקופה"></div>
      <div id="stats"></div>
    </div>
    <div id="list" role="list"></div>
    <div id="detail" hidden></div>
  </aside>

  <section id="mapCol">
    <div id="mapWrap">
      <svg id="map" viewBox="0 0 1254 1254" role="img" aria-label="מפת המקומות ההיסטוריים"></svg>
      <button id="reset">↺ מבט מלא</button>
    </div>
    <p id="mapHint">גודל הנקודה = כמה דמויות עברו במקום. לחיצה פותחת את מה שקרה שם.</p>
  </section>
</main>

<div id="toast"></div>
<script type="module" src="/src/places/main.js"></script>
</body>
</html>

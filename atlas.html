<body>

<header id="bar">
  <a id="brand" href="/" title="ציר הזמן של עם ישראל - לדף הבית">
    <h1>🗺️ מסע הדורות</h1>
    <span>ציר הזמן של עם ישראל</span>
  </a>
  <a class="tool primary" id="toTimeline" href="/" title="מעבר לתצוגת ציר הזמן">📜 <span class="tl">ציר הזמן</span></a>
  <div id="search">
    <input id="q" type="search" autocomplete="off" placeholder="חיפוש דמות, אירוע או מקום…"
      aria-label="חיפוש" aria-expanded="false" aria-controls="qres"/>
    <div id="qres" role="listbox" aria-label="תוצאות חיפוש"></div>
  </div>
  <button id="qtoggle" aria-label="חיפוש" title="חיפוש">🔍</button>
  <span class="spacer"></span>
  <div id="tools">
    <button class="tool" id="tIns">📊 <span class="tl">תובנות</span></button>
    <button class="tool" id="tTree">👑 <span class="tl">בית דוד</span></button>
    <button class="tool" id="tShare">🔗 <span class="tl">שיתוף</span></button>
  </div>
</header>

<nav id="eras" aria-label="תקופות"></nav>
<div id="sheetBack"></div>
<nav id="modeNav" aria-label="מצבי תצוגה">
  <a class="mn-tab" id="mnTimeline" href="/">📜 ציר הזמן</a>
  <span class="mn-tab on" aria-current="page">🗺️ מסע הדורות</span>
</nav>
<aside id="detail" aria-label="פרטי הפריט">
  <div id="dcHost"></div>
</aside>

<div id="mapPane">
  <div id="mapHead">
    <h2 id="mapTitle">מסע הדורות</h2>
    <div id="mapBtns">
      <button class="mbtn play" id="bPlay"><svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true"><path d="M16 4 L6 12 L16 20 Z" fill="currentColor"/></svg> הפעלת המסע</button>
      <button class="mbtn" id="bPrev">הקודם</button>
      <button class="mbtn" id="bNext">הבא</button>
      <button class="mbtn" id="bAll" title="חזרה למבט על כל המסלול">סקירה כללית</button>
      <button class="mbtn" id="mapClose">✕ סגירת המפה</button>
    </div>
  </div>
  <div id="mapBody">
    <div id="mapBox">
      <div id="fit">
        <div id="zoom">
          <img src="/israel_map_square2.png" alt="מפת ארץ ישראל והמרחב"/>
          <svg id="ov" viewBox="0 0 1254 1254" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div id="pop"></div>
      </div>
      <div id="noMap"><span>לפריט זה אין מפת מסע</span></div>
    </div>
    <div id="legend"></div>
  </div>
</div>

<main id="story"></main>
<div id="toast"></div>

<script type="module" src="/src/atlas/main.js"></script>
</body>
</html>

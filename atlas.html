<body>

<header id="bar">
  <!-- הכותרת ולצדה תפריט המטא, בדיוק כמו בציר הזמן -->
  <div id="brandWrap">
    <a id="brand" href="/" title="ציר הזמן של עם ישראל - לדף הבית">
      <h1>🗺️ מסע הדורות</h1>
    </a>
    <span class="title-icons">
      <button class="title-ico" id="mAbout" title="אודות הפרויקט" aria-label="אודות הפרויקט">ℹ️</button>
      <button class="title-ico" id="mTour" title="מדריך היכרות" aria-label="מדריך היכרות">❓</button>
    </span>
  </div>
  <!-- אותו מתג מפוצל של ציר הזמן, כדי שהמעבר יהיה מובן משני הצדדים -->
  <div class="mode-switch" role="group" aria-label="מצב תצוגה">
    <a class="ms-opt" id="toTimeline" href="/" title="מי חי מתי, ומי לצד מי">📜 ציר הזמן</a>
    <span class="ms-opt on" aria-current="page">🗺️ מסע הדורות</span>
    <a class="ms-opt" href="/places" title="לפי מקום: מי עבר בכל מקום ומה קרה שם">📍 מפת הארץ</a>
  </div>
  <div id="barEnd">
    <!-- hidden עד ש-placeSearch מעביר את התיבה לראש הרשימה: בלעדיו היא
         הבזיקה לרגע בסרגל העליון, במקום שבו היא יושבת ב-HTML הסטטי -->
    <div id="search" hidden>
      <input id="q" type="search" autocomplete="off" placeholder="חיפוש דמות, אירוע או מקום…"
        aria-label="חיפוש" aria-expanded="false" aria-controls="qres"/>
      <div id="qres" role="listbox" aria-label="תוצאות חיפוש"></div>
    </div>
    <div id="tools">
      <button class="tool" id="tTours">🧭 <span class="tl">מסעות</span></button>
      <button class="tool" id="tTree">👑 <span class="tl">בית דוד</span></button>
      <button class="tool" id="tNote">✉️ <span class="tl">הערה למנהל</span></button>
      <button class="tool" id="tShare" title="שיתוף">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81A3 3 0 1 0 6 15c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/></svg>
        <span class="tl">שיתוף</span>
      </button>
    </div>
    <div id="notesHost"></div>
  </div>
</header>

<nav id="eras" aria-label="תקופות"></nav>
<div id="sheetBack"></div>
<nav id="modeNav" aria-label="מצבי תצוגה">
  <a class="mn-tab" id="mnTimeline" href="/">📜 ציר הזמן</a>
  <span class="mn-tab on" aria-current="page">🗺️ מסע הדורות</span>
  <a class="mn-tab" href="/places">📍 מפת הארץ</a>
</nav>
<aside id="detail" aria-label="פרטי הפריט">
  <div id="dcHost"></div>
</aside>

<div id="mapPane"><div id="jmHost"></div></div>

<main id="story"></main>
<div id="toast"></div>

<script type="module" src="/src/atlas/main.js"></script>
